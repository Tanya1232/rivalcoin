<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Rival Ecosystem & Hub</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-gold: #f59e0b;
            --accent-glow: #fbbf24;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 70%);
        }

        /* Шапка баланса */
        .header {
            padding: 20px 15px 10px;
            text-align: center;
        }

        .brand-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .balance-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 5px;
        }

        .coin-icon-small {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 20px;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
            border: 2px solid #fef08a;
        }

        .balance-value {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }

        /* Контентные вкладки */
        .tab-content {
            flex: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-y: auto;
        }

        .tab-content.active {
            display: flex;
        }

        /* Вкладка Тапалка */
        .tapper-area {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .big-coin-btn {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, #fbbf24 0%, #d97706 70%, #78350f 100%);
            border: 8px solid #fef08a;
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.05s ease;
            margin: 20px 0;
            position: relative;
        }

        .big-coin-btn:active {
            transform: scale(0.94);
        }

        .big-coin-symbol {
            font-size: 90px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        /* Энергия */
        .energy-box {
            width: 80%;
            max-width: 300px;
            margin-top: 15px;
        }

        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .energy-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .energy-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #f59e0b, #3b82f6);
            border-radius: 10px;
            transition: width 0.2s ease;
        }

        /* Анимация клика (+1) */
        .tap-pop {
            position: absolute;
            color: #ffffff;
            font-size: 32px;
            font-weight: 900;
            pointer-events: none;
            animation: popUp 0.8s ease-out forwards;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
            z-index: 100;
        }

        @keyframes popUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.3); }
        }

        /* Карточки Игр / Прокачки / Кошелька */
        .card-list {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-icon {
            font-size: 32px;
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .card-sub {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 3px;
        }

        .action-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        /* Нижнее меню */
        .nav-bar {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 12px 5px 20px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-sub);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            width: 22%;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--accent-gold);
        }

        .nav-icon {
            font-size: 22px;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <div class="brand-title">RIVAL ECOSYSTEM</div>
        <div class="balance-container">
            <div class="coin-icon-small">R</div>
            <div class="balance-value" id="balance">0</div>
        </div>
    </div>

    <!-- Вкладка 1: Тапалка -->
    <div class="tab-content active" id="tab-tapper">
        <div class="tapper-area">
            <div class="big-coin-btn" id="coin-btn">
                <span class="big-coin-symbol">R</span>
            </div>

            <div class="energy-box">
                <div class="energy-info">
                    <span>⚡ Энергия</span>
                    <span id="energy-text">1000 / 1000</span>
                </div>
                <div class="energy-bar-bg">
                    <div class="energy-bar-fill" id="energy-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Вкладка 2: Игры (Ecosystem Hub) -->
    <div class="tab-content" id="tab-games">
        <div class="card-list">
            <div class="card">
                <div class="card-left">
                    <div class="card-icon">🏃</div>
                    <div>
                        <div class="card-title">Subway Runner 3D</div>
                        <div class="card-sub">Зарабатывай $RIVAL в беге!</div>
                    </div>
                </div>
                <button class="action-btn" onclick="launchGame('https://tanya1232.github.io/subway-runner-3d/')">ИГРАТЬ</button>
            </div>

            <div class="card" style="opacity: 0.6;">
                <div class="card-left">
                    <div class="card-icon">🚗</div>
                    <div>
                        <div class="card-title">Rival Racing 3D</div>
                        <div class="card-sub">Скоро в экосистеме...</div>
                    </div>
                </div>
                <button class="action-btn" style="background: #475569;" disabled>LOCK</button>
            </div>
        </div>
    </div>

    <!-- Вкладка 3: Прокачка -->
    <div class="tab-content" id="tab-boosts">
        <div class="card-list">
            <div class="card">
                <div class="card-left">
                    <div class="card-icon">👆</div>
                    <div>
                        <div class="card-title">Мульти-Тап</div>
                        <div class="card-sub" id="multitap-sub">+1 за тап | Цена: 100</div>
                    </div>
                </div>
                <button class="action-btn" onclick="buyUpgrade('multitap')">БУСТ</button>
            </div>

            <div class="card">
                <div class="card-left">
                    <div class="card-icon">🔋</div>
                    <div>
                        <div class="card-title">Макс. Энергия</div>
                        <div class="card-sub" id="energy-sub">+500 к базе | Цена: 200</div>
                    </div>
                </div>
                <button class="action-btn" onclick="buyUpgrade('energy')">БУСТ</button>
            </div>
        </div>
    </div>

    <!-- Вкладка 4: Кошелек -->
    <div class="tab-content" id="tab-wallet">
        <div class="card-list">
            <div class="card" style="justify-content: center; text-align: center; padding: 30px 15px;">
                <div style="color: var(--text-sub); font-size: 15px; line-height: 1.5;">
                    👛 Кошелек пока пуст.<br>Интеграция Web3 появится позже!
                </div>
            </div>
        </div>
    </div>

    <!-- Нижнее меню -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('tapper', this)">
            <div class="nav-icon">🪙</div>
            <span>Тапалка</span>
        </div>
        <div class="nav-item" onclick="switchTab('games', this)">
            <div class="nav-icon">🎮</div>
            <span>Игры</span>
        </div>
        <div class="nav-item" onclick="switchTab('boosts', this)">
            <div class="nav-icon">⚡</div>
            <span>Прокачка</span>
        </div>
        <div class="nav-item" onclick="switchTab('wallet', this)">
            <div class="nav-icon">👛</div>
            <span>Кошелек</span>
        </div>
    </div>

    <!-- Интеграция Firebase и логика приложения -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Твоя конфигурация из консоли Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDfnuR07pt2IIWCScmI7H4aSy57XIHZpHg",
            authDomain: "rivalcoin-738cc.firebaseapp.com",
            projectId: "rivalcoin-738cc",
            storageBucket: "rivalcoin-738cc.firebasestorage.app",
            messagingSenderId: "53292984166",
            appId: "1:53292984166:web:63d508b16bb8c04affcaa7"
        };

        // Инициализация Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Инициализация Telegram WebApp
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Определение ID пользователя (Из Telegram или тестовый для браузера)
        let userId = tg?.initDataUnsafe?.user?.id;
        if (!userId) {
            userId = localStorage.getItem('rival_demo_uid') || 'demo_' + Math.floor(Math.random() * 1000000);
            localStorage.setItem('rival_demo_uid', userId);
        }

        const userDocRef = doc(db, "users", String(userId));
        let isDirty = false; // Флаг для синхронизации изменений с базой

        // Начальное состояние пользователя
        let state = {
            balance: 0,
            energy: 1000,
            maxEnergy: 1000,
            tapValue: 1,
            multitapCost: 100,
            energyCost: 200,
            username: tg?.initDataUnsafe?.user?.username || 'Player'
        };

        // Загрузка данных из Firebase Firestore
        async function loadUserData() {
            try {
                const docSnap = await getDoc(userDocRef);
                if (docSnap.exists()) {
                    const cloudData = docSnap.data();
                    state = { ...state, ...cloudData };
                } else {
                    // Создание записи для нового игрока
                    await setDoc(userDocRef, state);
                }
            } catch (error) {
                console.error("Ошибка загрузки данных из Firestore:", error);
            }
            updateUI();
        }

        // Сохранение данных в Cloud Firestore
        async function saveUserData() {
            try {
                await setDoc(userDocRef, state, { merge: true });
            } catch (error) {
                console.error("Ошибка сохранения в Firestore:", error);
            }
        }

        // Обновление элементов UI
        function updateUI() {
            document.getElementById('balance').innerText = state.balance.toLocaleString();
            document.getElementById('energy-text').innerText = `${state.energy} / ${state.maxEnergy}`;
            
            const fillPercent = Math.max(0, Math.min(100, (state.energy / state.maxEnergy) * 100));
            document.getElementById('energy-fill').style.width = `${fillPercent}%`;

            document.getElementById('multitap-sub').innerText = `+${state.tapValue + 1} за тап | Цена: ${state.multitapCost}`;
            document.getElementById('energy-sub').innerText = `+500 к базе | Цена: ${state.energyCost}`;
        }

        // Обработка Тапа
        const coinBtn = document.getElementById('coin-btn');

        function handleTap(e) {
            if (e.type === 'touchstart') e.preventDefault();

            if (state.energy < state.tapValue) return;

            state.energy -= state.tapValue;
            state.balance += state.tapValue;
            isDirty = true; // Отмечаем, что есть несинхронизированные данные

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            // Вылетающий текст +X
            const rect = coinBtn.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            const x = (clientX || (rect.left + rect.width / 2)) - rect.left;
            const y = (clientY || (rect.top + rect.height / 2)) - rect.top;

            const pop = document.createElement('div');
            pop.className = 'tap-pop';
            pop.innerText = `+${state.tapValue}`;
            pop.style.left = `${x}px`;
            pop.style.top = `${y}px`;
            coinBtn.appendChild(pop);

            setTimeout(() => pop.remove(), 800);

            updateUI();
        }

        coinBtn.addEventListener('touchstart', handleTap, { passive: false });
        coinBtn.addEventListener('click', handleTap);

        // Регенерация энергии (3 ед/сек)
        setInterval(() => {
            if (state.energy < state.maxEnergy) {
                state.energy = Math.min(state.maxEnergy, state.energy + 3);
                isDirty = true;
                updateUI();
            }
        }, 1000);

        // Авто-сохранение в облако каждые 3 секунды при наличии изменений
        setInterval(() => {
            if (isDirty) {
                saveUserData();
                isDirty = false;
            }
        }, 3000);

        // Функция покупки апгрейдов
        window.buyUpgrade = function(type) {
            if (type === 'multitap' && state.balance >= state.multitapCost) {
                state.balance -= state.multitapCost;
                state.tapValue += 1;
                state.multitapCost *= 2;
                saveUserData();
            } else if (type === 'energy' && state.balance >= state.energyCost) {
                state.balance -= state.energyCost;
                state.maxEnergy += 500;
                state.energy += 500;
                state.energyCost *= 2;
                saveUserData();
            }
            updateUI();
        };

        // Запуск сторонних игр
        window.launchGame = function(url) {
            if (tg) tg.openLink(url);
            else window.location.href = url;
        };

        // Переключение вкладок
        window.switchTab = function(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById(`tab-${tabName}`).classList.add('active');
            el.classList.add('active');
        };

        // Запуск приложения и загрузка прогресса из Firestore
        loadUserData();
    </script>
</body>
</html>
